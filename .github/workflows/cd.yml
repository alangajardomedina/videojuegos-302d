name: Despliegue en AWS con EKS(elastic kubernet service)
on:
  push:
    branches:
      - deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      CLUSTER_NAME: gamecatalog-cluster
    steps:
      - name: Checkout (git clone...)
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-session-token: ${{secrets.AWS_SESSION_TOKEN}}
          aws-region: ${{env.AWS_REGION}}
      
      - name: Loguear con ECR (elastic container registry)
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Rescatar el AWS Account ID
        run: |
          echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Definir las URL de los ECR
        run: |
          echo "BACKEND_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/backend_gamecatalog" >> $GITHUB_ENV
          echo "FRONTEND_ECR=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/frontend_gamecatalog" >> $GITHUB_ENV
      
      - name: Build backend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $BACKEND_ECR:${GITHUB_SHA} \
            ./backend \
            --load
      - name: Push backend
        run: |
          docker push $BACKEND_ECR:${GITHUB_SHA}

      - name: Build frontend
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t $FRONTEND_ECR:${GITHUB_SHA} \
            ./frontend \
            --load
      - name: Push frontend
        run: |
          docker push $FRONTEND_ECR:${GITHUB_SHA}
      
      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
      - name: Configurar EKS a través de GitHub ACtions
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $CLUSTER_NAME
      - name: Aplicar los manifiestos de kubernet
        run: |
          kubectl apply -f infra/k8s/
          
      - name: Actualizar nombre de la imagen del backend en backend.yml
        run: |
          kubectl set image deployment/backend \
            backend=$BACKEND_ECR:${GITHUB_SHA}
      - name: Actualizar nombre de la imagen del frontend en frontend.yml
        run: |
          kubectl set image deployment/frontend \
            frontend=$FRONTEND_ECR:${GITHUB_SHA}
      
      - name: Esperar despliegue del backend
        run: |
          kubectl rollout status deployment/backend
      - name: Esperar despliegue del frontend
        run: |
          kubectl rollout status deployment/frontend